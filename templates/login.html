<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 부서 경비 정산 시스템</title>
    <style>
        body { font-family: '맑은 고딕', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 360px; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #4b5563; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .login-btn { width: 100%; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .login-btn:hover { background: #1e40af; }
        .error-msg { color: #ef4444; font-size: 13px; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 경비 정산 시스템</h2>
        
        {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="input-group">
                <label>아이디 (부서/계정명)</label>
                <input type="text" name="username" placeholder="예: 시운전, admin, 생산" required autofocus>
            </div>
            <div class="input-group">
                <label>비밀번호</label>
                <input type="password" name="password" placeholder="비밀번호 입력" required>
            </div>
            <button type="submit" class="login-btn">로그인</button>
        </form>
    </div>
</body>
</html>
